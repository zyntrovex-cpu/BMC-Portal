<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notice Board — BMC Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="portal.css" rel="stylesheet" />
  <style>
    .sb-link.active{border-color:var(--accent);} .sb-logo{background:var(--accent);} .sb-av{background:var(--accent);}
    .notice-card{background:#fff;border-radius:14px;box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden;transition:.2s;}
    .notice-card:hover{box-shadow:var(--shadow);}
    .notice-card.unread .nc-head{background:#fffbeb;}
    .nc-head{padding:16px 20px;display:flex;align-items:flex-start;gap:14px;}
    .nc-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .nc-body{padding:0 20px 16px;}
    .nc-foot{padding:10px 20px 14px;background:#f8fafc;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
    .pin-badge{background:#fef9c3;color:#854d0e;border-radius:6px;padding:2px 10px;font-size:11px;font-weight:700;}
    .portal-header-banner{border-radius:14px;padding:18px 24px;margin-bottom:20px;color:#fff;}
    .filter-btn{border-radius:20px;font-size:12.5px;padding:5px 14px;}
    .filter-btn.active-filter{color:#fff;}
    #noticesContainer .notice-card{display:block;}
    #noticesContainer .notice-card.hidden{display:none;}
  </style>
</head>
<body>
<div class="overlay" id="ov" onclick="closeSb()"></div>
<div class="sidebar" id="sb">
  <div class="sb-brand">
    <div class="sb-logo" id="sbLogo"><i class="fas fa-bullhorn"></i></div>
    <div class="sb-title"><h6>BMC Portal</h6><small id="portalLabel">Notice Board</small></div>
  </div>
  <div class="sb-menu">
    <div class="sb-section" id="sbSection">Navigation</div>
    <a class="sb-link" href="#" id="backLink"><i class="fas fa-arrow-left"></i> Back to Portal</a>
    <a class="sb-link active" href="#"><i class="fas fa-bullhorn"></i> Notice Board</a>
    <div class="sb-section" id="sbSection2" style="display:none">Manage</div>
    <a class="sb-link" href="admin-notices.html" id="manageLink" style="display:none"><i class="fas fa-pen-to-square"></i> Manage Notices</a>
    <div class="sb-section">Account</div>
    <a class="sb-link" href="index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>
  <div class="sb-foot">
    <div class="sb-av" id="sbAv"><i class="fas fa-user"></i></div>
    <div class="sb-foot-info"><h6 id="footName">User</h6><small id="footRole">BMC Portal</small></div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="toggle-btn" onclick="toggleSb()"><i class="fas fa-bars"></i></button>
      <span class="topbar-title" id="topbarTitle"><i class="fas fa-bullhorn"></i> Notice Board</span>
    </div>
    <div class="topbar-right">
      <span class="badge" id="unreadBadge" style="font-size:12px;background:#ef4444;color:#fff">3 Unread</span>
      <img id="topAvatar" src="https://ui-avatars.com/api/?name=User&background=7c3aed&color=fff&size=36" style="width:36px;height:36px;border-radius:50%;" />
    </div>
  </div>

  <div class="content">
    <!-- Portal identity banner -->
    <div class="portal-header-banner" id="portalBanner">
      <div class="d-flex align-items-center gap-3">
        <div id="bannerIcon" style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0"></div>
        <div>
          <div class="fw-bold" id="bannerName" style="font-size:16px"></div>
          <div style="font-size:12.5px;opacity:.85" id="bannerSub"></div>
        </div>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="d-flex gap-2 flex-wrap align-items-center mb-4" id="filterBar">
      <button class="btn btn-sm filter-btn active-filter" id="filterAll" onclick="setFilter('all',this)" style="background:var(--accent);border-color:var(--accent)">All Notices</button>
      <button class="btn btn-sm btn-outline-secondary filter-btn" onclick="setFilter('pinned',this)"><i class="fas fa-thumbtack me-1"></i>Pinned</button>
      <!-- dynamic category buttons injected by JS -->
      <div class="ms-auto"><input type="text" class="form-control form-control-sm" placeholder="Search notices..." oninput="handleSearch(this.value)" style="max-width:210px" /></div>
    </div>

    <div id="noticesContainer"></div>

    <div id="emptyState" style="display:none;text-align:center;padding:48px 0;color:#94a3b8">
      <i class="fas fa-bell-slash" style="font-size:48px;margin-bottom:16px;display:block"></i>
      <div style="font-size:15px">No notices found</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ─── Notice data ────────────────────────────────────────────────────────────

  { id:14, title:'System Maintenance — 25 May 2026 (Night)',     body:'Portal scheduled maintenance from 11:00 PM to 02:00 AM on 25–26 May. The system will be unavailable during this window. Please inform relevant staff.',                                                                                                           category:'system',   audience:'admin',    priority:'important', date:'22 May 2026', author:'IT Department',          pinned:true  },
  { id:15, title:'New Student Enrollment — June Batch',          body:'Registration for June 2026 batch opens 5 June 2026. Admin staff to prepare enrollment forms, fee schedules, and class allocation sheets. Estimated enrollment: 180 students.',                                                                                      category:'admin',    audience:'admin',    priority:'normal',    date:'20 May 2026', author:'Administration',        pinned:false },
];

// ─── Portal config ───────────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const p = (params.get('p') || 'admin').toLowerCase();

const portalConfig = {

    name:         'Student Portal',
    backLink:     'student-dashboard.html',
    backLabel:    'Student Portal',
    footName:     'Ahmed Ali',
    footRole:     'Class 12-A · Roll 101',
    avatarBg:     '1d4ed8',
    avatarName:   'Ahmed+Ali',
    bannerGrad:   'linear-gradient(135deg,#1e3a8a,#1d4ed8)',
    bannerIcon:   'fas fa-user-graduate',
    bannerName:   'Ahmed Ali',
    bannerSub:    'Class 12-A · Roll 101 · Student Portal',
    topTitle:     'Notice Board — Student Portal',
    topColor:     '#1d4ed8',
    audienceFilter: n => n.audience === 'students' || n.audience === 'all',
    categories:   ['exam','holiday','sports','finance','general'],

    showAdmin:    false,
  },
  teacher: {
    accent:       '#059669',
    name:         'Teacher Portal',
    backLink:     'teacher-dashboard.html',
    backLabel:    'Teacher Portal',
    footName:     'Dr. Sarah Khan',
    footRole:     'Physics Teacher',
    avatarBg:     '059669',
    avatarName:   'Sarah+Khan',
    bannerGrad:   'linear-gradient(135deg,#064e3b,#059669)',
    bannerIcon:   'fas fa-chalkboard-teacher',
    bannerName:   'Dr. Sarah Khan',
    bannerSub:    'Physics · Teacher Portal',
    topTitle:     'Notice Board — Teacher Portal',
    topColor:     '#059669',
    audienceFilter: n => n.audience === 'teachers' || n.audience === 'all' || n.audience === 'staff',
    categories:   ['staff','academic','training','holiday','general'],
    catLabels:    {staff:'Staff', academic:'Academic', training:'Training', holiday:'Holidays', general:'General'},
    showAdmin:    false,
  },
  finance: {
    accent:       '#d97706',
    name:         'Finance Portal',
    backLink:     'finance-dashboard.html',
    backLabel:    'Finance Portal',
    footName:     'Ms. Ayesha Rizvi',
    footRole:     'Finance Officer',
    avatarBg:     'd97706',
    avatarName:   'Ayesha+Rizvi',
    bannerGrad:   'linear-gradient(135deg,#78350f,#d97706)',
    bannerIcon:   'fas fa-coins',
    bannerName:   'Ms. Ayesha Rizvi',
    bannerSub:    'Finance Officer · Finance Portal',
    topTitle:     'Notice Board — Finance Portal',
    topColor:     '#d97706',
    audienceFilter: n => n.audience === 'finance' || n.audience === 'all',
    categories:   ['finance','holiday','general'],
    catLabels:    {finance:'Finance', holiday:'Holidays', general:'General'},
    showAdmin:    false,
  },
  admin: {
    accent:       '#7c3aed',
    name:         'Admin Panel',
    backLink:     'admin-dashboard.html',
    backLabel:    'Admin Panel',
    footName:     'Mr. Tariq Mehmood',
    footRole:     'System Administrator',
    avatarBg:     '7c3aed',
    avatarName:   'Tariq+Mehmood',
    bannerGrad:   'linear-gradient(135deg,#2e1065,#7c3aed)',
    bannerIcon:   'fas fa-shield-alt',
    bannerName:   'Mr. Tariq Mehmood',
    bannerSub:    'System Administrator · Admin Panel',
    topTitle:     'Notice Board — Admin Panel',
    topColor:     '#7c3aed',
    audienceFilter: () => true,
    categories:   ['exam','general','holiday','sports','finance','staff','academic','training','system','admin'],
    catLabels:    {exam:'Exams', general:'General', holiday:'Holidays', sports:'Sports', finance:'Finance', staff:'Staff', academic:'Academic', training:'Training', system:'System', admin:'Admin'},
    showAdmin:    true,
  },
};

const cfg = portalConfig[p] || portalConfig.admin;

// ─── Category icon/color map ─────────────────────────────────────────────────
const catMeta = {
  exam:     { color:'#ef4444', bg:'#fef2f2', icon:'fas fa-file-alt',         label:'Exam'     },
  general:  { color:'#1d4ed8', bg:'#eff6ff', icon:'fas fa-info-circle',       label:'General'  },
  holiday:  { color:'#059669', bg:'#f0fdf4', icon:'fas fa-star-and-crescent', label:'Holiday'  },
  sports:   { color:'#d97706', bg:'#fffbeb', icon:'fas fa-trophy',            label:'Sports'   },
  finance:  { color:'#d97706', bg:'#fffbeb', icon:'fas fa-coins',             label:'Finance'  },
  staff:    { color:'#7c3aed', bg:'#fdf4ff', icon:'fas fa-users',             label:'Staff'    },
  academic: { color:'#0891b2', bg:'#ecfeff', icon:'fas fa-book-open',         label:'Academic' },
  training: { color:'#059669', bg:'#f0fdf4', icon:'fas fa-graduation-cap',    label:'Training' },
  system:   { color:'#475569', bg:'#f1f5f9', icon:'fas fa-server',            label:'System'   },
  admin:    { color:'#7c3aed', bg:'#fdf4ff', icon:'fas fa-shield-alt',        label:'Admin'    },
};

// ─── Apply portal config to DOM ──────────────────────────────────────────────
function applyConfig() {
  document.documentElement.style.setProperty('--accent', cfg.accent);
  document.title = 'Notice Board — ' + cfg.name;

  document.getElementById('portalLabel').textContent   = cfg.name;
  document.getElementById('backLink').href             = cfg.backLink;
  document.getElementById('backLink').innerHTML        = '<i class="fas fa-arrow-left"></i> ' + cfg.backLabel;
  document.getElementById('footName').textContent      = cfg.footName;
  document.getElementById('footRole').textContent      = cfg.footRole;
  document.getElementById('topAvatar').src             = 'https://ui-avatars.com/api/?name=' + cfg.avatarName + '&background=' + cfg.avatarBg + '&color=fff&size=36';

  const topTitle = document.getElementById('topbarTitle');
  topTitle.innerHTML = '<i class="fas fa-bullhorn" style="color:' + cfg.accent + '"></i> ' + cfg.topTitle;

  const banner = document.getElementById('portalBanner');
  banner.style.background = cfg.bannerGrad;
  document.getElementById('bannerIcon').innerHTML = '<i class="' + cfg.bannerIcon + '"></i>';
  document.getElementById('bannerName').textContent = cfg.bannerName;
  document.getElementById('bannerSub').textContent  = cfg.bannerSub;

  if (cfg.showAdmin) {
    document.getElementById('sbSection2').style.display = '';
    document.getElementById('manageLink').style.display  = '';
  }

  // Inject category filter buttons
  const bar = document.getElementById('filterBar');
  const searchDiv = bar.querySelector('.ms-auto');
  cfg.categories.forEach(cat => {
    const m = catMeta[cat] || { color:'#64748b', label: cat };
    const btn = document.createElement('button');
    btn.className = 'btn btn-sm btn-outline-secondary filter-btn';
    btn.setAttribute('data-cat', cat);
    btn.textContent = cfg.catLabels[cat] || m.label;
    btn.onclick = function(){ setFilter(cat, this); };
    bar.insertBefore(btn, searchDiv);
  });
}

// ─── Render notices ──────────────────────────────────────────────────────────
let visibleNotices = [];
let currentFilter  = 'all';
let currentSearch  = '';

function renderNotices() {
  const container = document.getElementById('noticesContainer');
  container.innerHTML = '';

  let filtered = visibleNotices.filter(n => {
    const matchFilter =
      currentFilter === 'all'    ? true :
      currentFilter === 'pinned' ? n.pinned :
      n.category === currentFilter;

    const matchSearch = currentSearch === '' ||
      n.title.toLowerCase().includes(currentSearch) ||
      n.body.toLowerCase().includes(currentSearch)  ||
      n.author.toLowerCase().includes(currentSearch);

    return matchFilter && matchSearch;
  });

  const emptyState = document.getElementById('emptyState');
  if (filtered.length === 0) {
    emptyState.style.display = '';
    document.getElementById('unreadBadge').style.display = 'none';
    return;
  }
  emptyState.style.display = 'none';

  // Sort: pinned first, then by id desc
  filtered.sort((a,b) => (b.pinned - a.pinned) || (b.id - a.id));

  let unreadCount = 0;
  filtered.forEach((n, idx) => {
    const isUnread = idx < 3;
    if (isUnread) unreadCount++;

    const m = catMeta[n.category] || { color:'#64748b', bg:'#f1f5f9', icon:'fas fa-info-circle', label: n.category };

    const priorityBadge =
      n.priority === 'urgent'    ? '<span class="badge bg-danger">Urgent</span>'  :
      n.priority === 'important' ? '<span class="badge bg-primary">Important</span>' :
                                   '<span class="badge bg-secondary">Normal</span>';

    const pinnedBadge = n.pinned ? '<span class="pin-badge"><i class="fas fa-thumbtack me-1"></i>Pinned</span>' : '';
    const unreadBadge = isUnread ? '<span class="badge bg-warning text-dark" style="font-size:11px">Unread</span>' : '';
    const catBadge    = '<span class="badge" style="background:' + m.bg + ';color:' + m.color + ';border:1px solid ' + m.color + '33">' + (m.label) + '</span>';

    const card = document.createElement('div');
    card.className = 'notice-card' + (isUnread ? ' unread' : '');
    card.setAttribute('data-cat', n.category);
    card.style.borderLeft = '5px solid ' + m.color;
    card.innerHTML = `
      <div class="nc-head">
        <div class="nc-icon" style="background:${m.bg};color:${m.color}"><i class="${m.icon}"></i></div>
        <div style="flex:1">
          <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
            ${pinnedBadge}${priorityBadge}${catBadge}${unreadBadge}
          </div>
          <h6 class="fw-bold mb-0" style="font-size:15px">${n.title}</h6>
        </div>
        <div style="font-size:11px;color:#94a3b8;white-space:nowrap">${n.date}</div>
      </div>
      <div class="nc-body"><p style="font-size:13.5px;color:#475569;margin:0">${n.body}</p></div>
      <div class="nc-foot">
        <div style="font-size:12px;color:#94a3b8">Posted by: ${n.author}</div>
        ${cfg.showAdmin ? `<div class="d-flex gap-1"><button class="btn btn-sm btn-outline-secondary" style="font-size:11px" onclick="alert('Edit notice #${n.id}')"><i class="fas fa-edit me-1"></i>Edit</button><button class="btn btn-sm btn-outline-danger" style="font-size:11px" onclick="alert('Delete notice #${n.id}')"><i class="fas fa-trash me-1"></i>Delete</button></div>` : ''}
      </div>`;
    container.appendChild(card);
  });

  const badge = document.getElementById('unreadBadge');
  if (unreadCount > 0) {
    badge.style.display = '';
    badge.textContent   = unreadCount + ' Unread';
  } else {
    badge.style.display = 'none';
  }
}

// ─── Filter / search handlers ────────────────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('active-filter');
    b.style.background    = '';
    b.style.borderColor   = '';
    b.style.color         = '';
    b.classList.remove('btn-secondary');
    b.classList.add('btn-outline-secondary');
  });
  btn.classList.add('active-filter');
  btn.classList.remove('btn-outline-secondary');
  btn.classList.add('btn-secondary');
  btn.style.background  = cfg.accent;
  btn.style.borderColor = cfg.accent;
  btn.style.color       = '#fff';
  renderNotices();
}

function handleSearch(q) {
  currentSearch = q.toLowerCase();
  renderNotices();
}

// ─── Sidebar toggle ──────────────────────────────────────────────────────────
function toggleSb(){document.getElementById('sb').classList.toggle('open');document.getElementById('ov').classList.toggle('show');}
function closeSb(){document.getElementById('sb').classList.remove('open');document.getElementById('ov').classList.remove('show');}

// ─── Init ────────────────────────────────────────────────────────────────────
applyConfig();
visibleNotices = allNotices.filter(cfg.audienceFilter);
renderNotices();

// Activate the "All" button styling on load
(function(){
  const b = document.getElementById('filterAll');
  b.style.background  = cfg.accent;
  b.style.borderColor = cfg.accent;
  b.style.color       = '#fff';
})();
</script>
</body>
</html>
