<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMC Portal — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #06122a 0%, #0e2347 50%, #0d47a1 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px;
    }
    .login-wrap {
      width: 100%; max-width: 460px;
      background: #fff; border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden;
    }
    /* Header */
    .lh {
      background: linear-gradient(135deg, #0e2347 0%, #1565c0 100%);
      padding: 32px 28px 26px; text-align: center; color: #fff;
    }
    .lh-icon {
      width: 64px; height: 64px; background: rgba(255,255,255,.15); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin: 0 auto 14px;
    }
    .lh h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
    .lh p  { font-size: 12px; opacity: .7; margin: 0; }

    /* Body */
    .lb { padding: 26px 28px 22px; }

    /* Role cards */
    .role-label { font-size: 10px; font-weight: 700; color: #6b7a8d; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 10px; }
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 22px; }
    .rc {
      border: 1.5px solid #d5dde8; border-radius: 6px; padding: 12px 8px;
      text-align: center; cursor: pointer; transition: .15s; background: #f8fafc;
    }
    .rc:hover { border-color: #1565c0; background: #eff6ff; }
    .rc.active { border-color: #1565c0; background: #eff6ff; }
    .rc i { font-size: 20px; display: block; margin-bottom: 5px; }
    .rc span { font-size: 11.5px; font-weight: 600; color: #1e293b; }
    .rc small { display: block; font-size: 9.5px; color: #8a9ab0; margin-top: 1px; }
    .rc.s i { color: #1565c0; } .rc.t i { color: #059669; } .rc.a i { color: #7c3aed; } .rc.f i { color: #d97706; }

    /* Form */
    .field-label { font-size: 10.5px; font-weight: 700; color: #4a5c70; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; display: block; }
    .form-control { border: 1px solid #c6d0dc; border-radius: 4px; font-size: 13px; height: 37px; width: 100%; padding: 0 10px; }
    .form-control:focus { border-color: #1565c0; box-shadow: 0 0 0 2px rgba(21,101,192,.12); outline: none; }
    .field-hint { font-size: 10px; color: #94a3b8; margin-top: 2px; }
    .pwd-wrap { position: relative; }
    .pwd-toggle { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; padding: 0; font-size: 12px; }
    .mb-f { margin-bottom: 14px; }

    .btn-login {
      background: #1565c0; color: #fff; border: none;
      width: 100%; height: 40px; border-radius: 5px;
      font-size: 13.5px; font-weight: 700; cursor: pointer; transition: .13s; margin-top: 4px;
    }
    .btn-login:hover { background: #1045a0; }

    .error-msg { display: none; background: #fee2e2; color: #991b1b; border-radius: 4px; padding: 8px 11px; font-size: 12px; margin-bottom: 12px; border-left: 3px solid #ef4444; }
    .error-msg.show { display: block; }

    /* Demo box */
    .demo-box { background: #f0f7ff; border: 1px solid #bfdbfe; border-radius: 5px; padding: 11px 14px; margin-top: 16px; }
    .demo-box-label { font-size: 9.5px; font-weight: 700; color: #1d4ed8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .demo-btn { padding: 6px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid; background: #fff; transition: .12s; text-align: left; }
    .demo-btn:hover { opacity: .75; }

    .foot { text-align: center; font-size: 10.5px; color: #94a3b8; margin-top: 14px; padding-bottom: 4px; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="lh">
    <div class="lh-icon"><i class="fas fa-school"></i></div>
    <h1>BMC Portal</h1>
    <p>Bahria Model College &nbsp;·&nbsp; Student Information Management System</p>
  </div>

  <div class="lb">
    <div class="role-label">Select your portal</div>
    <div class="role-grid">
      <div class="rc s active" onclick="pick('student',this)">
        <i class="fas fa-user-graduate"></i><span>Student</span><small>Roll Number</small>
      </div>
      <div class="rc t" onclick="pick('teacher',this)">
        <i class="fas fa-chalkboard-teacher"></i><span>Teacher</span><small>Employee ID</small>
      </div>
      <div class="rc a" onclick="pick('admin',this)">
        <i class="fas fa-shield-alt"></i><span>Admin</span><small>Admin ID</small>
      </div>
      <div class="rc f" onclick="pick('finance',this)">
        <i class="fas fa-coins"></i><span>Finance</span><small>Finance ID</small>
      </div>
    </div>

    <div id="errorMsg" class="error-msg"><i class="fas fa-exclamation-circle me-1"></i><span id="errTxt">Invalid ID or password.</span></div>

    <!-- POST /api/auth/login -->
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="mb-f">
        <label class="field-label" id="idLabel" for="userId">Roll Number</label>
        <input type="text" class="form-control" id="userId" name="user_id" placeholder="e.g. 101" autocomplete="username" />
        <div class="field-hint" id="idHint">Enter your Roll Number (e.g. 101)</div>
      </div>
      <div class="mb-f">
        <label class="field-label" for="password">Password</label>
        <div class="pwd-wrap">
          <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" style="padding-right:34px" autocomplete="current-password" />
          <button type="button" class="pwd-toggle" onclick="togglePwd()"><i class="fas fa-eye" id="pwdIcon"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt me-2"></i>Sign In</button>
    </form>

    <div class="demo-box">
      <div class="demo-box-label"><i class="fas fa-info-circle me-1"></i>Quick Demo Access</div>
      <div class="demo-grid">
        <button class="demo-btn" style="color:#1d4ed8;border-color:#bfdbfe" onclick="quickLogin('student')"><i class="fas fa-user-graduate me-1"></i>Student (101)</button>
        <button class="demo-btn" style="color:#059669;border-color:#a7f3d0" onclick="quickLogin('teacher')"><i class="fas fa-chalkboard-teacher me-1"></i>Teacher (T001)</button>
        <button class="demo-btn" style="color:#7c3aed;border-color:#ddd6fe" onclick="quickLogin('admin')"><i class="fas fa-shield-alt me-1"></i>Admin (ADM001)</button>
        <button class="demo-btn" style="color:#d97706;border-color:#fde68a" onclick="quickLogin('finance')"><i class="fas fa-coins me-1"></i>Finance (FIN001)</button>
      </div>
    </div>

    <div class="foot">Academic Session 2025–26 &nbsp;·&nbsp; Bahria Education System</div>
  </div>
</div>

<script>
  const creds = {
    student: { id:'101',    pass:'student123', page:'student-dashboard.html', label:'Roll Number',  hint:'Enter your Roll Number (e.g. 101)' },
    teacher: { id:'T001',   pass:'teacher123', page:'teacher-dashboard.html', label:'Employee ID',  hint:'Enter your Employee ID (e.g. T001)' },
    admin:   { id:'ADM001', pass:'admin123',   page:'admin-dashboard.html',   label:'Admin ID',     hint:'Enter your Admin ID (e.g. ADM001)' },
    finance: { id:'FIN001', pass:'finance123', page:'finance-dashboard.html', label:'Finance ID',   hint:'Enter your Finance Officer ID (e.g. FIN001)' },
  };
  let role = 'student';

  function pick(r, el) {
    document.querySelectorAll('.rc').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    role = r;
    document.getElementById('idLabel').textContent = creds[r].label;
    document.getElementById('idHint').textContent   = creds[r].hint;
    document.getElementById('userId').placeholder   = creds[r].id;
    document.getElementById('errorMsg').classList.remove('show');
  }
  function quickLogin(r) {
    pick(r, document.querySelectorAll('.rc')[['student','teacher','admin','finance'].indexOf(r)]);
    document.getElementById('userId').value   = creds[r].id;
    document.getElementById('password').value = creds[r].pass;
    document.getElementById('errorMsg').classList.remove('show');
    setTimeout(() => window.location.href = creds[r].page, 150);
  }
  function doLogin(e) {
    if(e) e.preventDefault();
    const id = document.getElementById('userId').value.trim();
    const p  = document.getElementById('password').value;
    if (!id || !p) {
      document.getElementById('errTxt').textContent = 'Please enter your ID and password.';
      document.getElementById('errorMsg').classList.add('show'); return;
    }
    if (id === creds[role].id && p === creds[role].pass) {
      document.getElementById('errorMsg').classList.remove('show');
      window.location.href = creds[role].page;
    } else {
      document.getElementById('errTxt').textContent = 'Invalid ' + creds[role].label + ' or password.';
      document.getElementById('errorMsg').classList.add('show');
    }
  }
  function togglePwd() {
    const f = document.getElementById('password'), ic = document.getElementById('pwdIcon');
    if(f.type==='password'){f.type='text'; ic.className='fas fa-eye-slash';}
    else{f.type='password'; ic.className='fas fa-eye';}
  }
</script>
</body>
</html>
